[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "keybox-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.0,<0.144", "uvicorn[standard]>=0.54.0,<0.55", "SQLAlchemy>=2.1.4,<2.2", "alembic>=1.20.0,<1.21", "argon2-cffi>=25.1.0,<26", "pydantic>=2.14.0,<2.15", "pydantic-settings>=2.15.0,<2.16"]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "httpx2>=2.13.1,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["keybox_backend*"]

